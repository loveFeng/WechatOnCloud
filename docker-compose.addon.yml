# WechatOnCloud（公众号素材归档插件 & AI MCP 增强版）
#
# 适用场景：
#   1. 全新部署或从原版 WechatOnCloud 无损原地升级（保留原 ./data-panel 与微信实例数据卷，不掉登录态）。
#   2. 面板使用插件分支镜像（默认 woc-panel:addon），微信实例仍使用官方原版 wechat-on-cloud 镜像。
#   3. 归档插件 Sidecar（默认 wxdown/wxdown-d:1.0.0）由面板在网页「管理 → 附加功能」勾选后按需拉起。
#
# 启动命令：
#   docker compose -f docker-compose.addon.yml up -d
#   （或在飞牛 fnOS / 群晖 Container Manager / 1Panel 的 Compose 项目中直接粘贴本文件内容）

services:
  panel:
    # 面板镜像（与下方微信实例镜像源解耦，避免误拉取上游无插件版面板）
    # 需提前通过 docker load 导入离线包，或在仓库根目录执行：docker build -t woc-panel:addon ./panel
    image: ${WOC_PANEL_IMAGE:-woc-panel:addon}
    # 若在完整克隆的源码目录内直接构建启动，可取消下一行注释并使用 --build：
    # build: ./panel
    container_name: woc-panel

    environment:
      - PORT=8080

      # ── 公众号素材归档插件 & MCP 配置 ──────────────────────────────
      # 归档文件宿主机输出根目录（建议在 NAS 上指定纯英文绝对路径，面板会自动创建 <该目录>/<实例id> 并赋权）：
      #   飞牛 fnOS 示例：/vol1/1000/wechat-archive
      #   群晖 DSM 示例： /volume1/docker/wechat-archive
      # 留空则默认存放在独立 Docker 命名卷 woc-addon-out-<实例id> 中。
      - WOC_ADDON_OUTPUT_ROOT=${WOC_ADDON_OUTPUT_ROOT:-}
      # 归档插件 Sidecar 镜像名（固定版本 Tag，本地已有同名镜像时面板直接复用，不联网拉取）
      - WOC_WXDOWN_IMAGE=${WOC_WXDOWN_IMAGE:-wxdown/wxdown-d:1.0.0}
      # 插件专用隔离网络名（默认 woc-addons，仅面板与插件容器互通，隔离微信实例容器）
      - WOC_ADDON_NETWORK=${WOC_ADDON_NETWORK:-woc-addons}
      # 插件运行配置与凭据持久化目录（位于下方 ./data-panel 卷内）
      - PANEL_ADDONS_DIR=${PANEL_ADDONS_DIR:-/data/addons}

      # ── 微信实例基础配置（保持上游官方微信镜像不变） ──────────────
      # 新建/升级微信实例时使用的镜像（amd64/arm64 多架构）；拉不动时可在 .env 设 WOC_IMAGE_PREFIX 切国内镜像站
      # （注意：请勿写成嵌套 ${A:-${B}}，部分 NAS 的 Compose 解析器不支持嵌套默认值）
      - WOC_WECHAT_IMAGE=${WOC_IMAGE_PREFIX:-docker.io/gloridust}/wechat-on-cloud:${WOC_VERSION:-latest}
      # 透传给微信实例与归档目录的属主 UID/GID（NAS 单用户一般为 1000）
      - PUID=${WOC_PUID:-1000}
      - PGID=${WOC_PGID:-1000}
      - TZ=${WOC_TZ:-Asia/Shanghai}
      # 新建微信实例的数据存放宿主目录（留空则使用 Docker 命名卷；已有老实例升级时保持原位置不变）
      - WOC_DATA_ROOT=${WOC_DATA_ROOT:-}

      # ── 面板管理员与访问安全 ──────────────────────────────────────
      # 面板首个管理员账号（仅首次启动、无 ./data-panel/accounts.json 时写入；上线请务必修改默认密码）
      - PANEL_ADMIN_USER=${WOC_USER:-admin}
      - PANEL_ADMIN_PASSWORD=${WOC_PASSWORD:-wechat}
      - PANEL_DATA=/data/accounts.json
      # 登录会话有效天数（持久化在 /data，面板升级重建不踢已登录管理员）
      - WOC_SESSION_DAYS=${WOC_SESSION_DAYS:-30}
      # DNS-rebinding 防护：局域网 IP / localhost 直连无需填写；
      # 若套 HTTPS 反向代理通过域名访问面板或调用 MCP，请填写免端口域名（多个用英文逗号分隔）
      - PANEL_ALLOWED_HOSTS=${PANEL_ALLOWED_HOSTS:-}
      # 反代在另一台设备（如软路由 nginx）时填写其 IP/网段，以便按真实客户端计数登录限速
      - WOC_TRUSTED_PROXIES=${WOC_TRUSTED_PROXIES:-}

      # ── 实例网络、硬件与自愈看门狗 ────────────────────────────────
      - WOC_DOCKER_NETWORK=${WOC_DOCKER_NETWORK:-}
      - WOC_INSTANCE_NETWORK=${WOC_INSTANCE_NETWORK:-}
      - WOC_VIDEO_DEVICES=${WOC_VIDEO_DEVICES:-}
      - WOC_ENABLE_GPU=${WOC_ENABLE_GPU:-}
      - WOC_DISABLE_IPV6=${WOC_DISABLE_IPV6:-}
      - WOC_INSTANCE_MEM_GB=${WOC_INSTANCE_MEM_GB:-}
      # 注：已启用「公众号素材归档」的实例会自动回收内置浏览器进程并默认豁免 soft 重启，防止无人值守掉登录
      - WOC_INSTANCE_MEM_SOFT_MB=${WOC_INSTANCE_MEM_SOFT_MB:-1500}
      - WOC_INSTANCE_MEM_HARD_MB=${WOC_INSTANCE_MEM_HARD_MB:-2500}
      - WOC_WATCHDOG_INTERVAL_SEC=${WOC_WATCHDOG_INTERVAL_SEC:-300}
      - WOC_WATCHDOG_HEALTH_FAILS=${WOC_WATCHDOG_HEALTH_FAILS:-0}
      - WOC_STUCK_HEAL=${WOC_STUCK_HEAL:-1}
      - WOC_SPOOF_OS=${WOC_SPOOF_OS:-1}
      - WOC_PULL_STALL_MIN=${WOC_PULL_STALL_MIN:-5}

    volumes:
      # 面板数据（账号、已有实例元信息、插件配置与 MCP Token；原地升级时直接复用原有 ./data-panel）
      - ./data-panel:/data
      # 面板经 Docker 引擎管理微信实例容器与归档插件 Sidecar、执行自动刷新动作
      - /var/run/docker.sock:/var/run/docker.sock
      # 宿主摄像头设备只读探测（不需要摄像头直通可删除此行）
      - /dev:/host-dev:ro

    ports:
      # 统一对外入口：既提供 Web 管理面板，也反代 AI MCP 端点 /mcp/wxdown/<实例id>
      - "${WOC_HTTP_PORT:-36080}:8080"

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"

    restart: unless-stopped
